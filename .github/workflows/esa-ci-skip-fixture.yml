name: ESA CI skip fixture

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  aislop-check:
    name: aislop-check skip fixture
    if: ${{ github.head_ref == 'esa-ci-skip-fixture-control' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Run aislop check
        run: npm run check:aislop
        timeout-minutes: 15
      - name: Run aislop checker tests
        run: npm run test:aislop
        timeout-minutes: 15

  required-ci:
    name: ESA Required CI skip fixture
    needs: aislop-check
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require successful CI
        if: ${{ !cancelled() }}
        env:
          AISLOP_RESULT: ${{ needs.aislop-check.result }}
        run: |
          if [[ "$AISLOP_RESULT" != success ]]; then
            echo "Required CI did not succeed (aislop-check=$AISLOP_RESULT)" >&2
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ cancelled() }}
        run: exit 1
