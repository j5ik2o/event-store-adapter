name: aislop check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aislop-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Run aislop check
        run: npm run check:aislop
        timeout-minutes: 15
      - name: Run aislop checker tests
        run: npm run test:aislop
        timeout-minutes: 15
