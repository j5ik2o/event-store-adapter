name: aislop check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  aislop-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The event can carry an old base, and GitHub can keep an old test merge for a while,
      # so the script checks the current pull request and builds the merge when needed.
      - name: Check out the current test merge
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/pr-test-merge.sh
      - name: Run PR test merge tests
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Run aislop check
        run: npm run check:aislop
        timeout-minutes: 15
      - name: Run aislop checker tests
        run: npm run test:aislop
        timeout-minutes: 15

  required-ci:
    name: ESA Required CI
    needs: aislop-check
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require successful CI
        if: ${{ !cancelled() }}
        env:
          AISLOP_RESULT: ${{ needs.aislop-check.result }}
        run: |
          if [[ "$AISLOP_RESULT" != success ]]; then
            echo "Required CI did not succeed (aislop-check=$AISLOP_RESULT)" >&2
            exit 1
          fi
      - name: Reject workflow cancellation
        if: ${{ cancelled() }}
        run: exit 1
